name: Feature request
description: Suggest a capability or behavior change
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want, with scope and risks.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - storage / domain
        - retrieval / tools
        - index injection
        - capture / dreaming
        - settings / UI
        - documentation / CI
        - other
    validations:
      required: true
