name: Bug report
description: Report a reproducible defect in dsh-memory
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private memory content, session logs or personal data. Report security issues privately via SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: dsh-memory, DSH and Node.js versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps or a test that reproduces the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification
      description: What did you run? Include lint/typecheck/test/build results if relevant.
